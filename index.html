<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Расписание занятий Новосибирского политехнического колледжа: пары на день и неделю, учёт посещаемости, офлайн-режим.">
    <meta name="theme-color" id="meta-theme" content="#1C1B1F">
    <title>Расписание НПК</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Расписание">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Расписание НПК</h1>
            <div class="header-actions">
                <button class="icon-btn" id="refresh-btn" aria-label="Обновить расписание" title="Обновить">🔄</button>
                <button class="icon-btn" id="view-toggle" aria-label="День / неделя" title="День / неделя">📅</button>
            </div>
        </div>
        <div class="updated-label" id="updated-label">Загрузка…</div>
    </div>

    <div class="content" id="content">
        <div class="loader">Загрузка данных...</div>
    </div>

    <div class="ios-hint" id="ios-hint">
        <span><b>Совет:</b> нажмите «Поделиться» → «На экран "Домой"», чтобы установить приложение.</span>
        <button class="ios-hint-close" id="ios-hint-close" aria-label="Скрыть подсказку">✕</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-tab="schedule" id="nav-schedule" role="button" tabindex="0">
            <span class="nav-icon">📚</span><span>Расписание</span>
        </div>
        <div class="nav-item" data-tab="attendance" id="nav-attendance" role="button" tabindex="0">
            <span class="nav-icon">📊</span><span>Посещаемость</span>
        </div>
        <div class="nav-item" data-tab="settings" id="nav-settings" role="button" tabindex="0">
            <span class="nav-icon">⚙️</span><span>Настройки</span>
        </div>
    </div>
</body>
</html>
